app-id: com.nomachine.nxplayer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
separate-locales: false
command: launch_nxplayer

tags:
  - proprietary
  - network
  - remote-desktop

finish-args:
  - --device=all # For backward compatibility, in the future we should use 'dri', 'input', and 'usb'
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --filesystem=~/.nx:create
  - --filesystem=~/.ssh:ro
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=x11
  - --socket=ssh-auth
  - --socket=cups
  - --socket=pcsc

modules:
  - name: nomachine-player
    buildsystem: simple
    build-commands:
      - install -D $FLATPAK_ID.png $FLATPAK_DEST/share/icons/hicolor/256x256/apps/$FLATPAK_ID.png
      - install -D $FLATPAK_ID.desktop $FLATPAK_DEST/share/applications/$FLATPAK_ID.desktop
      - install -D $FLATPAK_ID.metainfo.xml $FLATPAK_DEST/share/metainfo/$FLATPAK_ID.metainfo.xml
      - install -D apply_extra $FLATPAK_DEST/bin/apply_extra
      - install -D launch_nxplayer $FLATPAK_DEST/bin/launch_nxplayer
    sources:
      - type: extra-data
        only-arches:
          - x86_64
        url: https://web9001.nomachine.com/download/10.2/Linux/nomachine-player_10.2.3_1_x86_64.tar.gz
        sha256: 24e83dec495c6cb33ab9ce83080c1f1a7a32b6c12063f05216699d204e280b5a
        filename: nomachine-player.tar.gz
        size: 63581338

      - type: extra-data
        only-arches:
          - aarch64
        url: https://web9001.nomachine.com/download/10.2/Arm/nomachine-player_10.2.3_1_aarch64.tar.gz
        sha256: 67e5e3038567c975d0e370624f4452cef2cf98cdb62936c740d6fe92a987fbe3
        filename: nomachine-player.tar.gz
        size: 64496877

      - type: file
        path: data/com.nomachine.nxplayer.png

      - type: file
        path: data/com.nomachine.nxplayer.desktop

      - type: file
        path: com.nomachine.nxplayer.metainfo.xml

      - type: script
        dest-filename: apply_extra
        commands:
          - |
            tar -xf nomachine-player.tar.gz --strip-components=0
            NX_INSTALL_PREFIX=/app/extra ./NX/nxinstall --install fedora > /dev/null 2>&1
            rm /app/extra/NX/lib/libstdc++.so.6 #remove the bundled libstdc++.so.6 to avoid conflicts with runtime libs

      - type: script
        dest-filename: launch_nxplayer
        commands:
          - exec /app/extra/NX/bin/nxplayer "$@"
